[workspace]
members = [
  "crates/kokura-core",
  "crates/kokura-debug",
  "crates/kokura-bridge",
  "crates/kokura-cli",
  "crates/kokura-capi",
  "crates/kokura-py",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["DAISUKE OBA"]
license = "MIT"

[workspace.dependencies]
bitflags = "2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
bincode = "1"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
parking_lot = "0.12"
rfd = "0.17"
tokio = { version = "1", features = ["macros", "rt", "time"] }
pyo3 = { version = "0.22", features = ["extension-module"] }
